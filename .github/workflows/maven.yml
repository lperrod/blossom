name: Java CI with Maven

on:
  push:
    branches: [ 4.0.0 ]
  pull_request:
    branches: [ 4.0.0 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -pl '!blossom-ui/blossom-ui-angular' --file pom.xml

